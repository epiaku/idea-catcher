# The Idea Catcher stack (Stage B): the Postgres queue, the migrations (run once) and the worker.
#   docker compose up -d --build   build the image and start db, migrate and worker
#   docker compose up -d db        only the database (for running `catcher` on the host)
#   docker compose logs -f worker  follow the worker
#   docker compose down            stop and remove the containers, keep the data
#   docker compose down -v         stop and delete the data too (queue and the cloned repos)
# Only one worker may hold the lock: run `docker compose stop worker` before running
# `catcher run pipeline` or `catcher run publish` by hand, and `docker compose start worker` after.
# Settings come from .env (optional: environment variables work too). DATABASE_URL, IDEAS_REPO and DOCS_REPO
# are set below, so the host values in .env are ignored inside the containers. See .env.example.
# The database defaults match the host DATABASE_URL: postgresql+psycopg://catcher:catcher@localhost:5432/catcher
x-app: &app
  build: .
  image: idea-catcher:latest
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://catcher:${DB_PASSWORD:-catcher}@db:5432/catcher
    IDEAS_REPO: /data/repos/idea-bucket
    DOCS_REPO: /data/repos/epiaku-docs
    IDEAS_REMOTE: ${IDEAS_REMOTE:-}
    DOCS_REMOTE: ${DOCS_REMOTE:-}
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: catcher
      POSTGRES_PASSWORD: ${DB_PASSWORD:-catcher}
      POSTGRES_DB: catcher
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - catcher-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catcher -d catcher"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    command: ["catcher", "db", "upgrade"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  worker:
    <<: *app
    command: ["catcher", "worker"]
    restart: unless-stopped
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "catcher", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - repos:/data/repos
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  catcher-pgdata:
  repos:
