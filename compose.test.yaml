# Overrides for the smoke run only (scripts/compose-smoke): never for real use.
#   docker compose -p catcher-smoke-<n> --env-file <empty file> -f compose.yaml -f compose.test.yaml up -d --build
# Local bare repos instead of GitHub, every schedule each minute, no LLM and no YouTube, no .env.
# The script exports SMOKE_IMAGE, SMOKE_REMOTES, DB_PORT, API_PORT, SMOKE_GITHUB_TOKEN and SMOKE_API_KEYS (dummies).
x-smoke: &smoke
  image: ${SMOKE_IMAGE:?set SMOKE_IMAGE (a throwaway tag such as idea-catcher:smoke-1234)}
  # The host .env holds real keys: the smoke run never reads it.
  env_file: !reset []
  environment:
    IDEAS_REMOTE: /remotes/idea-bucket.git
    DOCS_REMOTE: /remotes/epiaku-docs.git
    GITHUB_TOKEN: ${SMOKE_GITHUB_TOKEN:-}
    OPENAI_API_KEY: ""  # with no key the OpenAI profiles defer without a call
    OPENAI_MODEL_CLIPPINGS: smoke-unused
    OPENAI_MODEL_YOUTUBE: smoke-unused
    OPENAI_BASE_URL: http://127.0.0.1:1/v1
    FREELLMAPI_API_KEY: ""
    FREELLMAPI_URL: http://127.0.0.1:1/v1
    LLM_MAX_ATTEMPTS: "1"
    YOUTUBE_OFFLINE: "1"
    SCHEDULE_IDEAS_PULL: "* * * * *"
    SCHEDULE_PIPELINE_RUN: "* * * * *"
    SCHEDULE_PUBLISH: "* * * * *"
    SCHEDULE_TIMEZONE: UTC
    GIT_AUTHOR_NAME: idea-catcher-smoke
    GIT_AUTHOR_EMAIL: idea-catcher-smoke@example.com
    GIT_COMMITTER_NAME: idea-catcher-smoke
    GIT_COMMITTER_EMAIL: idea-catcher-smoke@example.com

services:
  db:
    # compose.yaml already binds 127.0.0.1; this makes DB_PORT mandatory, so a smoke run never falls back to 5432.
    ports: !override
      - "127.0.0.1:${DB_PORT:?set DB_PORT (never 5432)}:5432"

  migrate:
    <<: *smoke

  worker:
    <<: *smoke
    volumes:
      - repos:/data/repos
      - ${SMOKE_REMOTES:?set SMOKE_REMOTES (a temp dir with the bare repos)}:/remotes

  # Not the x-smoke anchor: the api keeps its own three variables (no token, no LLM settings); only the key
  # is a dummy, never a host API_KEYS, and the port a random one.
  api:
    image: ${SMOKE_IMAGE:?set SMOKE_IMAGE (a throwaway tag such as idea-catcher:smoke-1234)}
    environment:
      API_KEYS: ${SMOKE_API_KEYS:?set SMOKE_API_KEYS (a dummy key)}
    ports: !override
      - "127.0.0.1:${API_PORT:?set API_PORT (a random free port)}:8000"
